<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Up! | 創作者專屬專頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.15);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { background: var(--bg-body); color: var(--text-main); font-family: 'Inter', 'Noto Sans TC', sans-serif; margin: 0; line-height: 1.6; overflow-x: hidden;}

        /* ---- Navigation ---- */
        .vt-nav-wrapper {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            height: 60px;
            display: flex; align-items: center; justify-content: center;
        }
        .vt-nav {
            width: 100%; max-width: 1100px; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo-vup { font-size: 1.25rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px;}
        .vt-nav-links { display: flex; gap: 24px; }
        .vt-nav-item { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .vt-nav-item:hover { color: var(--primary); }
        .btn-fan { background: var(--primary); color: white; padding: 8px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; transition: all 0.2s; }
        .btn-fan:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ---- Premium Header ---- */
        .v-banner {
            height: 380px;
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            position: relative;
            background-size: cover;
            background-position: center;
            margin-top: 60px; /* offset for fixed nav */
        }
        .v-banner::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent, var(--bg-body));
        }

        .profile-container { max-width: 1100px; margin: -100px auto 0; padding: 0 24px; position: relative; z-index: 10; }
        
        .profile-header-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 32px;
            border: 1px solid var(--surface);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            margin-bottom: 32px;
        }

        .avatar-box {
            width: 160px; height: 160px;
            border-radius: 40px;
            overflow: hidden;
            border: 6px solid var(--surface);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #fff;
            flex-shrink: 0;
            position: relative;
            margin-top: -80px; /* 跟隨組員 fan_profile 的設計，突破卡片邊界 */
            align-self: flex-start;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Premium Glow */
        .avatar-box::before {
            content: ''; position: absolute; inset: -10px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.3s; z-index: -1;
        }
        .avatar-box:hover::before { opacity: 0.2; }

        .profile-info { flex: 1; }
        .profile-info h1 { font-size: 2.8rem; font-weight: 900; margin: 0; color: #1e1b4b; line-height: 1.2;}
        .profile-handle { color: var(--primary); font-weight: 700; margin-bottom: 12px; display: block; }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .p-tag { background: #fff; padding: 6px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 4px; }
        .p-tag.certified { color: #0284c7; border-color: #bae6fd; background: #f0f9ff; }

        .vt-socials { display: flex; gap: 12px; margin-top: 15px; }
        .vt-social-link {
            width: 40px; height: 40px; border-radius: 50%; background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); text-decoration: none; border: 1px solid var(--border); transition: all 0.2s;
        }
        .vt-social-link:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); color: var(--primary); border-color: var(--primary); }

        /* ---- Main Grid ---- */
        .profile-grid { display: grid; grid-template-columns: 1fr 340px; gap: 32px; padding-bottom: 100px; }

        .content-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 32px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 32px;
        }
        .content-card h2 { font-size: 1.4rem; font-weight: 800; margin-top: 0; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .content-card h2 i { color: var(--primary); }

        /* Milestones */
        .ms-grid { display: grid; gap: 20px; }
        .ms-item { padding: 24px; border-radius: 20px; background: #fcfcfd; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .ms-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #d8b4fe; }
        .ms-progress-wrap { height: 12px; background: #f1f5f9; border-radius: 6px; overflow: hidden; margin: 16px 0; }
        .ms-progress-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #c084fc); border-radius: 6px; width: 0%; transition: width 1s ease-out; }
        
        /* Post Feed */
        .post-feed { display: grid; gap: 24px; }
        .post-card { padding: 24px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 15px; }
        .post-header { display: flex; align-items: center; gap: 15px; }
        .post-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
        .post-meta { display: flex; flex-direction: column; }
        .post-author-name { font-weight: 700; color: var(--text-main); }
        .post-time { font-size: 0.85rem; color: var(--text-muted); }
        .post-content p { margin: 0; font-size: 1.05rem; line-height: 1.6; color: var(--text-main); white-space: pre-wrap;}
        .post-image { width: 100%; border-radius: 12px; object-fit: cover; max-height: 400px; margin-top: 15px; }
        
        /* Modals */
        .post-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);
            z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .post-modal-overlay.open { display: flex; opacity: 1; }
        .post-modal-card {
            background: var(--surface); width: 100%; max-width: 480px; padding: 40px; border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); transform: translateY(20px); transition: transform 0.3s;
        }
        .post-modal-overlay.open .post-modal-card { transform: translateY(0); }
        .ms-input-wrap { position: relative; }
        .ms-input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--text-muted); }
        .ms-input { width: 100%; padding: 16px 16px 16px 60px; border-radius: 16px; border: 2px solid var(--border); font-size: 1.2rem; font-weight: 700; box-sizing: border-box; outline: none; transition: border-color 0.2s;}
        .ms-input:focus { border-color: var(--primary); }

        @media (max-width: 900px) {
            .profile-grid { grid-template-columns: 1fr; }
            .profile-header-card { flex-direction: column; text-align: center; gap: 20px; padding: 30px; }
            .profile-tags { justify-content: center; }
            .vt-socials { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="vt-nav-wrapper">
        <nav class="vt-nav">
            <div style="display:flex; align-items:center; gap:20px;">
                <a href="index.html" class="nav-logo-vup"><i class="fas fa-play"></i> V-UP!</a>
                <span style="color:var(--border);">|</span>
                <span id="nav-creator-name" style="font-weight:700; color:var(--text-main);">載入中...</span>
            </div>
            <div class="vt-nav-actions" id="nav-actions">
                <a href="auth.html" class="btn-fan">平台登入</a>
            </div>
        </nav>
    </div>

    <!-- Banner Background -->
    <div class="v-banner" id="vt-banner"></div>

    <div class="profile-container">
        <!-- Hero Header Card -->
        <header class="profile-header-card">
            <div class="avatar-box">
                <img src="https://api.dicebear.com/7.x/notionists/svg?seed=creator" id="vt-avatar" alt="Avatar">
            </div>
            <div class="profile-info">
                <span class="profile-handle" id="vt-handle">@Channel</span>
                <h1 id="vt-name">即將見面</h1>
                <p id="vt-catchphrase" style="color: var(--text-muted); font-size: 1.15rem; margin: 12px 0;">載入創作者資訊中...</p>
                
                <!-- Dynamic Tags -->
                <div class="profile-tags" id="vt-tags-container">
                    <!-- Badges mapped here via JS -->
                </div>

                <!-- Dynamic Socials -->
                <div class="vt-socials" id="vt-socials">
                    <!-- Social endpoints here -->
                </div>
            </div>
            <div class="profile-actions" id="support-actions">
                <button class="btn btn-primary btn-fan" style="padding: 16px 36px; border-radius: 999px; font-weight: 800; font-size: 1.1rem; box-shadow: 0 8px 20px var(--primary-glow);" onclick="document.querySelector('#milestones').scrollIntoView({behavior: 'smooth'})">
                    立刻應援支持 <i class="fas fa-heart"></i>
                </button>
            </div>
        </header>

        <div class="profile-grid">
            <!-- Left Main Column -->
            <main>
                <!-- Milestones Section -->
                <section class="content-card" id="milestones">
                    <h2><i class="fas fa-sparkles"></i> 創作者企劃 (Milestones)</h2>
                    <div id="milestones-active-list" class="ms-grid">
                        <div style="text-align:center; padding:30px; color:var(--text-muted);">
                            <i class="fas fa-spinner fa-spin" style="font-size:2rem; margin-bottom:15px; color:var(--border);"></i>
                            <p>同步雲端企劃中...</p>
                        </div>
                    </div>
                </section>

                <!-- NEW: Posts Feed Section -->
                <section class="content-card" id="posts-section">
                    <h2><i class="fas fa-paper-plane"></i> 最新動態 (Recent Posts)</h2>
                    <div id="posts-feed-list" class="post-feed">
                        <!-- Posts injected here via profile_engine.js -->
                        <div style="text-align:center; padding:30px; color:var(--text-muted); background:#f8fafc; border-radius:16px;">
                            <i class="fas fa-inbox" style="font-size:2rem; margin-bottom:15px; opacity:0.5;"></i>
                            <p>創作者還沒有發布任何動態喔！</p>
                        </div>
                    </div>
                </section>
            </main>
            
            <!-- Right Sidebar Column -->
            <aside>
                <section class="content-card">
                    <h3><i class="fas fa-info-circle" style="color:var(--text-muted);"></i> 關於我 (About)</h3>
                    <p id="vt-bio" style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; white-space: pre-wrap;">資料讀取中，請稍候...</p>
                </section>
                
                <section class="content-card" style="background:#f8fafc; border:none;">
                    <div style="text-align:center;">
                        <i class="fas fa-shield-cat" style="font-size:2.5rem; color:#cbd5e1; margin-bottom:15px;"></i>
                        <div style="font-weight:700; color:var(--text-main); margin-bottom:5px;">V-Up! 安全連線</div>
                        <p style="font-size:0.85rem; color:var(--text-muted); margin:0;">本頁面之贊助系統由綠界安全網路通道處理，請安心支持您的創作者。</p>
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- Payment Modal (Simulation) -->
    <div class="post-modal-overlay" id="payment-modal">
        <div class="post-modal-card" style="text-align: center; padding: 30px;">
            <div style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <h2 id="pay-title" style="margin-bottom: 10px;">支持創作者</h2>
            <p id="pay-desc" style="color: var(--text-muted); margin-bottom: 25px;">您的每一份支持，都是創作者前進的動力 ✨</p>
            
            <div class="ms-input-wrap" style="margin-bottom: 25px; max-width: 300px; margin-left: auto; margin-right: auto;">
                <span class="ms-input-icon">NTD</span>
                <input type="number" id="pay-amount" class="ms-input" placeholder="請輸入金額">
            </div>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-fan" style="background: #94a3b8;" onclick="window.closePaymentModal()">取消</button>
                <button class="btn-fan" onclick="window.confirmPayment()">確認支持</button>
            </div>
        </div>
    </div>

    <!-- Include Live Engine -->
    <script type="module" src="profile_engine.js"></script>
    
</body>
</html>
