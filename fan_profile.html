<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Up! 粉絲個人中心</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="fan_profile.css">
</head>
<body class="fan-body">

    <!-- Nav -->
    <nav class="top-nav">
        <div class="nav-brand">
            <a href="index.html" style="text-decoration: none;"><span style="font-weight: 900; background: linear-gradient(90deg, #ec4899, #0ea5e9); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.5rem;">V-UP!</span></a>
        </div>
        <div class="nav-links center-links">
            <a href="#" class="nav-link">發現創作者</a>
            <a href="#" class="nav-link">收藏動態</a>
        </div>
        <div class="nav-actions right-actions">
            <div class="user-menu-nav" style="display:flex; align-items:center; gap:12px;">
                <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix" alt="Avatar" class="nav-avatar" id="nav-avatar">
                <button id="logout-btn" style="background:transparent; border:1px solid #e5e7eb; border-radius:8px; padding:4px 12px; cursor:pointer;"><i class="fa-solid fa-sign-out-alt"></i> 登出</button>
            </div>
        </div>
    </nav>

    <div class="bg-gradient"></div>

    <div class="fan-container">
        <!-- Profile Main Card -->
        <div class="fan-card profile-card">
            <div class="profile-header">
                <div class="profile-info-wrap">
                    <div class="avatar-wrapper">
                        <img src="" alt="Avatar" id="fan-avatar">
                    </div>
                    <div class="info-content">
                        <span class="supporter-tag"><i class="fa-solid fa-star" style="color: #ec4899; margin-right: 6px;"></i> 專屬應援者</span>
                        <h2 class="fan-name">載入中...</h2>
                        <p class="fan-tagline">讓您的熱愛在此綻放 ✨</p>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn-edit-profile" onclick="alert('設定功能開發中')">編輯個人資料</button>
                </div>
            </div>

            <!-- Stats Panels -->
            <div class="profile-details-grid">
                <div class="stats-section">
                    <div class="stat-panel">
                        <h4 class="panel-header">我的應援紀錄</h4>
                        <ul class="stat-list">
                            <li>
                                <div class="icon-wrap bg-pink-light text-pink"><i class="fa-solid fa-users"></i></div>
                                <div class="stat-text">
                                    <span class="lbl">資助創作者</span>
                                    <span class="val" id="stat-vtuber-count">0 <small>位</small></span>
                                </div>
                            </li>
                            <li>
                                <div class="icon-wrap bg-blue-light text-blue"><i class="fa-solid fa-medal"></i></div>
                                <div class="stat-text">
                                    <span class="lbl">擁有勳章</span>
                                    <span class="val" id="stat-badge-count">0</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section: Following -->
        <div class="fan-card">
            <h3 class="section-title"><i class="fa-solid fa-heart text-pink"></i> 我陪伴成長的 V 們</h3>
            <div class="vtuber-flex" id="vtuber-flex-container">
                <div class="card p-4 text-center text-muted" style="width:100%; border: 2px dashed #ddd;">目前尚未追蹤任何創作者</div>
            </div>
        </div>
    </div>

    <footer class="fan-footer" style="text-align: center; padding: 40px; color: #94a3b8;">
        <p>© 2026 V-Up! | 讓愛成就夢想</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase_config.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from './firebase_config.js';
        import { authService } from './auth_service.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }
            initFanProfile(user.uid);
        });

        function initFanProfile(uid) {
            onSnapshot(doc(db, "users", uid), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                document.querySelector('.fan-name').innerText = data.name || "新進粉絲";
                document.getElementById('fan-avatar').src = data.avatar || "https://api.dicebear.com/7.x/notionists/svg?seed=" + uid;
                document.getElementById('nav-avatar').src = data.avatar || "https://api.dicebear.com/7.x/notionists/svg?seed=" + uid;
                
                if(data.bio) document.querySelector('.fan-tagline').innerText = data.bio;
            });
            
            // Stats real-time sync
            onSnapshot(doc(db, "stats", uid), (snap) => {
                if (!snap.exists()) return;
                const stats = snap.data();
                document.getElementById('stat-vtuber-count').innerText = stats.vtuberCount || 0;
                document.getElementById('stat-badge-count').innerText = stats.badgeCount || 0;
            });
        }

        document.getElementById('logout-btn').onclick = () => authService.logout();
    </script>
</body>
</html>
